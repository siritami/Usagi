name: Build debug APK

on:
  workflow_dispatch:
  push:
    branches:
      - master
      - main
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-debug-apk.yml"
  pull_request:
    paths:
      - "app/**"
      - "gradle/**"
      - "build.gradle"
      - "settings.gradle"
      - "gradle.properties"
      - "gradlew"
      - ".github/workflows/build-debug-apk.yml"

permissions:
  contents: read

jobs:
  build:
    name: Build debug APK
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK packages
        run: sdkmanager --channel=3 "platforms;android-37.0" "build-tools;37.0.0"

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Prepare custom serialization runtime
        shell: bash
        run: |
          ./gradlew :app:dependencies --configuration debugRuntimeClasspath
          serialization_jar=$(find "$HOME/.gradle/caches/modules-2/files-2.1/org.jetbrains.kotlinx/kotlinx-serialization-core-jvm" \
            -type f -name 'kotlinx-serialization-core-jvm-*.jar' -print -quit)

          if [[ -z "$serialization_jar" ]]; then
            echo "kotlinx-serialization-core-jvm was not found in the Gradle cache" >&2
            exit 1
          fi

          mkdir -p build/ci-dependencies
          cp "$serialization_jar" build/ci-dependencies/kotlinx-serialization-core-jvm.jar
          zip -d build/ci-dependencies/kotlinx-serialization-core-jvm.jar \
            kotlinx/serialization/internal/PluginGeneratedSerialDescriptor.class

      - name: Build debug APK
        run: >-
          ./gradlew assembleDebug --stacktrace
          -PcustomSerializationCoreJar="$GITHUB_WORKSPACE/build/ci-dependencies/kotlinx-serialization-core-jvm.jar"

      - name: Upload debug APK
        uses: actions/upload-artifact@v4
        with:
          name: usagi-debug-apk
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14
